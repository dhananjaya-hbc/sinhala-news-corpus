name: Daily collect

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 06:30 Sri Lanka time (UTC+5:30, no DST)
    # Backup: GitHub can drop scheduled runs at busy times (the top of the hour).
    # Deduplication makes a second run harmless; it only adds what the first missed.
    - cron: "17 3 * * *" # 03:17 UTC = 08:47 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: write
  issues: write # open/close alerts for failing sources

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Collect headlines
        id: collect
        run: python -m collector.collect

      # The steps below also run when collection failed (e.g. every source was
      # down), so the failure is remembered in data/health.json and alerted on.
      - name: Update STATS.md
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        run: python scripts/stats.py

      - name: Commit and push if data changed
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME || 'github-actions[bot]' }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          git add STATS.md
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then
            echo "No new headlines; nothing to commit."
            exit 0
          fi
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          if [ "$(git diff --cached --name-only)" = "data/health.json" ]; then
            git commit -m "chore: update feed health $(TZ=Asia/Colombo date +%F)"
          else
            git commit -m "data: daily headlines $(TZ=Asia/Colombo date +%F)"
          fi
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open or close alerts for failing sources
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/source_alerts.py

  site:
    needs: collect
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
