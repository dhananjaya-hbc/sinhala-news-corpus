name: Daily collect

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 06:30 Sri Lanka time (UTC+5:30, no DST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Collect headlines
        run: python -m collector.collect

      - name: Update STATS.md
        run: python scripts/stats.py

      - name: Commit and push if data changed
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME || 'github-actions[bot]' }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          git add STATS.md
          if [ -d data ]; then git add data; fi
          if git diff --cached --quiet; then
            echo "No new headlines; nothing to commit."
            exit 0
          fi
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git commit -m "data: daily headlines $(TZ=Asia/Colombo date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  site:
    needs: collect
    uses: ./.github/workflows/deploy-site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
