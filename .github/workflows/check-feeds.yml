name: Check feeds

# Manually test feeds from GitHub's network (some sites block cloud IPs).
# Leave "urls" empty to check every feed in sources.yaml.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated feed URLs (empty = all feeds in sources.yaml)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check feeds
        env:
          URLS: ${{ inputs.urls }}
        # $URLS is intentionally unquoted so it splits into one argument per URL
        run: python scripts/check_feeds.py $URLS
